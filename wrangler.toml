name = "claude-call"
main = ".wrangler/worker/src/main.py"
base_dir = ".wrangler/worker"
compatibility_flags = ["python_workers"]
compatibility_date = "2026-11-10"

[[rules]]
type = "Data"
globs = ["pyproject.toml"]
fallthrough = true

[build]
command = "make stage-worker"

[[d1_databases]]
binding = "DB" # The namespace injected into the ASGI scope
database_name = "claude_call_db"
database_id = "7eb8c9df-c768-42c9-b7af-7f5aaa7a8821"
migrations_dir = "src/migrations"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
