services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_call"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: python scripts/migrate.py
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/claude_call
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/claude_call
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
