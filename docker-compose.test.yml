# Minimal compose for CI: spins up Postgres, runs migrations, verifies they succeed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_call"]
      interval: 3s
      timeout: 2s
      retries: 15

  migrate:
    build: .
    command: python scripts/migrate.py
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/claude_call
    depends_on:
      db:
        condition: service_healthy
